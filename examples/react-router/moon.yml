tasks:
  build:
    command: 'bun run build'
    deps:
      - 'react-router:build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - 'package.json'

  type-check:
    command: 'bun run type-check'
    deps:
      - 'react-router:build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - 'package.json'

  dev:
    command: 'bun run dev'
    deps:
      - 'react-router:build'
    preset: 'server'
