tasks:
  build:
    command: 'bun run build'
    deps:
      - 'gatsby:build'
      - 'react-elements:build'
    inputs:
      - 'src/**/*'
      - 'gatsby-*.ts'
      - 'gatsby-*.tsx'
      - 'tsconfig.json'
      - 'package.json'
    outputs:
      - 'public/**'

  type-check:
    command: 'bun run type-check'
    deps:
      - 'gatsby:build'
      - 'react-elements:build'
    inputs:
      - 'src/**/*'
      - 'gatsby-*.ts'
      - 'gatsby-*.tsx'
      - 'tsconfig.json'
      - 'package.json'

  dev:
    command: 'bun run dev'
    deps:
      - 'gatsby:build'
      - 'react-elements:build'
    preset: 'server'
