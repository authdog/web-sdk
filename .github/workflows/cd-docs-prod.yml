name: cd-docs-prod

on:
  push:
    branches:
      - main
    paths:
      - apps/docs/**
  workflow_dispatch:


env:
  # codebase
  STORE_PATH: ~/.pnpm-store
  # env
  ENVFILE_DOCS: apps/docs/.env
  # secrets
  # TINYBIRD_TOKEN: ${{ secrets.TINYBIRD_TOKEN }}
  # POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Use taobao registry
        run: npm config set registry https://registry.npmmirror.com/

      - name: Setup PNPM store path
        run: pnpm config set store-dir ${{ env.STORE_PATH }}

      - name: Setup Pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-cache-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-cache-

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      
      - name: Prepare console environment variables
        run: |
          {
            echo "NEXT_PUBLIC_FOO=bar"
          } > ${{ env.ENVFILE_DOCS }}

      - name: Build docs
        run: |
          cd apps/docs
          pnpm build

      - name: Install netlify CLI
        run: |
          pnpm add esbuild@0.25.5 -D -w
          pnpm add netlify-cli@22.1.3 -D -w

      - name: Deploy to Netlify
        run: |
          cd apps/docs
          npx netlify link --id 1ddcb1ef-752b-4911-9c81-01506ce51ef9
          npx netlify deploy --dir=out --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }} 