name: cd-docs-prod

on:
  push:
    branches:
      - main
    paths:
      - apps/docs/**
  workflow_dispatch:


env:
  # codebase
  BUN_CACHE_PATH: ~/.bun/install/cache
  # env
  ENVFILE_DOCS: apps/docs/.env
  # secrets
  # TINYBIRD_TOKEN: ${{ secrets.TINYBIRD_TOKEN }}
  # POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.11

      - name: Use taobao registry
        run: echo "registry=https://registry.npmmirror.com/" > ~/.npmrc

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.BUN_CACHE_PATH }}
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
      
      - name: Prepare console environment variables
        run: |
          {
            echo "NEXT_PUBLIC_FOO=bar"
          } > ${{ env.ENVFILE_DOCS }}

      - name: Build docs
        run: |
          cd apps/docs
          bun run build

      - name: Deploy to Netlify
        run: |
          cd apps/docs
          bunx netlify-cli@22.1.3 link --id 1ddcb1ef-752b-4911-9c81-01506ce51ef9
          bunx netlify-cli@22.1.3 deploy --dir=out --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }} 