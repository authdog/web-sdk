name: next-app-deploy

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - examples/nextjs-app/**
  #     - .github/workflows/cd-next-app-deploy.yml

env:
  BUN_CACHE_PATH: ~/.bun/install/cache
  ENVFILE_CONSOLE: examples/nextjs-app/.env
  SCOPE_VERCEL: david-barrats-projects-b894a911
  PROJECT_VERCEL: nextjs-demo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: dbrrt/setup-moon@v1.0.0

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.BUN_CACHE_PATH }}
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: moon run '#publishable:build'

      - name: Update Next.js app dependencies
        run: |
          cd examples/nextjs-app
          bun add @authdog/nextjs-app@latest @authdog/react-elements@latest

      - name: "Replace catalog: tags with latest versions"
        run: bun .github/scripts/replace-catalog.js 'examples/nextjs-app/package.json'

      - name: Deploy to Vercel
        run: |
          bunx vercel deploy \
            --cwd examples/nextjs-app \
            --token ${{ secrets.VERCEL_CD_TOKEN }} \
            --scope ${{ env.SCOPE_VERCEL }} \
            --name ${{ env.PROJECT_VERCEL }} \
            --force \
            --yes \
            --prod \
            --build-env NODE_PATH=$PWD/node_modules
