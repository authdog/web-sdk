name: react-docs-deploy

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - packages/react-elements/**
  #     - .github/workflows/react-docs-deploy.yml

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 07cdb3d8cc681313ba8b3d915e35cd81
  STORE_PATH: ~/.pnpm-store
  # ENVFILE_CONSOLE: apps/nextjs-app/.env
  # SCOPE_VERCEL: david-barrats-projects-b894a911
  # PROJECT_VERCEL: react-elements

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set PNPM store path
        run: pnpm config set store-dir ${{ env.STORE_PATH }}

      - name: Cache PNPM store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-cache-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-cache-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Storybook
        run: |
          (cd packages/react-elements; \
            CLOUDFLARE_ACCOUNT_ID="${{ env.CLOUDFLARE_ACCOUNT_ID }}" \
            CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            NODE_ENV=prod \
            pnpm run deploy-docs
          )