name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dbrrt/setup-moon@v1.0.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.11

      - run: bun install --frozen-lockfile

      - run: moon ci

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.11

      - run: bun install --frozen-lockfile

      # Scan every workspace package against the vulnerability database.
      # Fails on high/critical advisories; lower the level to "moderate" to tighten.
      - name: bun audit
        run: bun audit --audit-level=high
