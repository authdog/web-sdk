name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `moon run :test` includes flutter:test, which depends on `dart pub get`.
      # ubuntu-latest does not ship the Dart SDK.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: dbrrt/setup-moon@v1.0.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: moon run :test
