name: CI (android)

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/android/**"
      - "packages/kotlin/src/main/kotlin/com/authdog/PublicKey.kt"
      - "packages/kotlin/src/main/kotlin/com/authdog/Cookies.kt"
      - "packages/kotlin/src/main/kotlin/com/authdog/Redirects.kt"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dbrrt/setup-moon@v1.0.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: moon run android:test
