name: remix-demo-deploy

on:
  # push:
    # branches:
    #   - main
    # paths:
    #   - examples/nextjs/**
    #   - .github/workflows/cd-next-app-demo.yml
  workflow_dispatch:

env:
  # codebase
  BUN_CACHE_PATH: ~/.bun/install/cache
  ENVFILE_CONSOLE: examples/remix/.env
  SCOPE_VERCEL: david-barrats-projects-b894a911
  PROJECT_VERCEL: remix-demo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: dbrrt/setup-moon@v1.0.0

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.BUN_CACHE_PATH }}
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: moon run '#publishable:build'
      
      - name: Install latest dependencies in nextjs
        run: |
          (cd examples/remix; bun add @authdog/remix-node@latest @authdog/react-elements@latest)

      - name: "Replace catalog: tags with latest versions"
        run: bun .github/scripts/replace-catalog.js 'examples/remix/package.json'

      - name: Ship Remix demo
        run: |
          bunx vercel deploy \
            --cwd examples/remix \
            --token ${{ secrets.VERCEL_CD_TOKEN }} \
            --scope ${{ env.SCOPE_VERCEL }} \
            --name ${{ env.PROJECT_VERCEL }} \
            --force \
            --yes \
            --prod \
            --build-env NODE_PATH=$PWD/node_modules