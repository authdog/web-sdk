name: packages-publish

on:
  push:
    branches:
      - main
    paths:
      - packages/**
  workflow_dispatch:

env:
  NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dbrrt/setup-moon@v1.0.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Configure NPM token
        run: echo "//registry.npmjs.org/:_authToken=${NPM_AUTH_TOKEN}" > ~/.npmrc

      - run: bun install --frozen-lockfile

      # One step covers both modes: pending changesets open the version PR,
      # otherwise publish-script runs. The built-in token is used on purpose.
      # GH_AUTOMATION_TOKEN expired (last rotated 2025-08-29) and GitHub
      # returns 401 Bad credentials for it.
      - name: Version or publish packages
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: bun run generate-pr
          publish-script: bun run publish-packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}