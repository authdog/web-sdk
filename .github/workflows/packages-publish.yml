name: packages-publish

on:
  workflow_dispatch:

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@authdog"

      - uses: dbrrt/setup-moon@v1.0.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Verify npm auth
        run: npm whoami

      - run: bun install --frozen-lockfile

      # Apply any pending changesets in this job. Do not open a version PR:
      # that PR touches every changed package and starts the per-package CI matrix.
      - name: Version pending changesets
        run: |
          if find .changeset -name '*.md' ! -name 'README.md' | grep -q .; then
            bunx changeset version
          else
            echo "No pending changesets"
          fi

      - name: Publish packages
        run: bun run publish-packages

      - name: Commit version bumps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset bun.lock packages/*/package.json packages/*/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Version Packages"
          git push
