tasks:
  build:
    command: 'bun run build'
    deps:
      - 'nextjs-app:build'
      - 'react-elements:build'
    inputs:
      - 'src/**/*'
      - 'app/**/*'
      - 'tsconfig.json'
      - 'package.json'

  dev:
    command: 'bun run dev'
    preset: 'server'

  lint:
    command: 'bun run lint'
    inputs:
      - 'src/**/*'
      - 'app/**/*'
      - 'eslint.config.mjs'
      - 'package.json'
