# Kotlin (Ktor) SDK. moon runs these as `system` tasks against the local JDK +
# Gradle toolchain — no Bun/Node involvement. CI provisions a JDK and Gradle.
tags:
  - publishable

tasks:
  build:
    command: 'gradle build'
    inputs:
      - 'src/**/*.kt'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

  test:
    command: 'gradle test'
    # Serialized after `build`: all three tasks invoke Gradle against the same
    # project dir and would otherwise corrupt the shared incremental-compilation
    # cache (build/kotlin/.../caches-jvm) when run concurrently in CI.
    deps:
      - 'build'
    inputs:
      - 'src/**/*.kt'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

  type-check:
    command: 'gradle compileTestKotlin'
    # Serialized after `test` for the same shared-cache reason as above.
    deps:
      - 'test'
    inputs:
      - 'src/**/*.kt'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
