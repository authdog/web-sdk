projects:
  # Examples
  nextjs-app-sample: 'examples/nextjs-app'
  remix-playground: 'examples/remix'
  vue-app: 'examples/vue-app'
  astro-app: 'examples/astro'
  sveltekit-app: 'examples/sveltekit'
  angular-app: 'examples/angular'
  express-api: 'examples/express'
  fastify-api: 'examples/fastify'
  react-native-app: 'examples/react-native'
  gatsby-app: 'examples/gatsby'
  redwood-app: 'examples/redwood'

  # Packages
  node-commons: 'packages/node-commons'
  nextjs-app: 'packages/nextjs-app'
  react-elements: 'packages/react-elements'
  remix-node: 'packages/remix'
  tanstack-start: 'packages/tanstack-start'
  vue: 'packages/vue'
  astro: 'packages/astro'
  sveltekit: 'packages/sveltekit'
  angular: 'packages/angular'
  express: 'packages/express'
  fastify: 'packages/fastify'
  react-native: 'packages/react-native'
  chrome-extension: 'packages/chrome-extension'
  gatsby: 'packages/gatsby'
  redwood: 'packages/redwood'
  eslint-config: 'packages/eslint'
  typescript-config: 'packages/typescript-config'

  # Non-Node SDKs (run as moon `system` tasks against their native toolchains)
  python: 'packages/python'
  go: 'packages/go'
  rust: 'packages/rust'
  kotlin: 'packages/kotlin'

vcs:
  provider: 'github'
  defaultBranch: 'main'

telemetry: false
